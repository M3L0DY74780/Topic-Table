services:
  - type: web
    name: topic-table-app
    runtime: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    healthCheckPath: /index.html
    envVars:
      - key: STATE_FILE
        value: /data/topic_table_state.json
    disk:
      name: topic-table-data
      mountPath: /data
      sizeGB: 1